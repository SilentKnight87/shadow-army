name: Plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; privacy-allow: action commit pin, not an email
        with:
          persist-credentials: false
      - run: ./scripts/test-public.sh
